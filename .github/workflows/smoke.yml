name: Smoke

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 11 * * 1-5"   # weekdays 11:17 UTC (~6:17 am New York)
  workflow_dispatch:

permissions:
  contents: read

# One Salesforce org: never run two suites against it at the same time.
concurrency:
  group: salesforce-org
  cancel-in-progress: false

jobs:
  smoke:
    # Pull requests from forks get no secrets in a public repo - skip them.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-sf-robot
        with:
          sfdx-auth-url: ${{ secrets.SFDX_AUTH_URL }}

      - name: Run smoke suite
        run: robot --argumentfile config/smoke.args --variable HEADLESS:True tests

      - name: Summary
        if: always()
        run: python tools/ci_summary.py results/smoke/output.xml >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-results
          path: results/smoke
          retention-days: 14
